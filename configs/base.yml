project:
  name: "Warehouse Flex Staffing & Demand Forecasting Optimizer"
  seed: 42

dataset:
  uci_id: 502
  uci_page_url: "https://archive.ics.uci.edu/dataset/502/online+retail+ii"
  uci_zip_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  raw_excel_path: "data/raw/online_retail_II.xlsx"
  worksheets:
    - "Year 2009-2010"
    - "Year 2010-2011"
  cleaning:
    cancellation_prefixes:
      - "C"
      - "A"
    min_quantity: 1
    min_unit_price: 0.0001
    admin_stock_codes:
      - "POST"
      - "DOT"
      - "M"
      - "D"
      - "CRUK"
      - "C2"
      - "BANK CHARGES"
      - "AMAZONFEE"
      - "B"
      - "S"
      - "PADS"
      - "SP1002"
    admin_stock_prefixes:
      - "TEST"
      - "ADJUST"
      - "GIFT_"

splits:
  min_lag_weeks: 52
  validation_weeks: 8
  test_weeks: 12

forecasting:
  lags_weeks:
    - 1
    - 4
    - 52
  ridge_alphas:
    - 0.01
    - 0.1
    - 1.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 250.0
    - 500.0
    - 1000.0
  clip_nonnegative: true

optimization:
  weekly_flex_hours: 40
  block_hours: 4
  weekly_blocks: 10
  min_daily_blocks: 0
  max_daily_blocks: 4
  # Capacity calibration strictly on initial-training daily workload (week_idx <= W - 21):
  # Because 7 of 8 quarters in initial training are off-peak spring/summer while the
  # held-out Q4 peak period runs ~2x higher, sizing Q4 staffing to the year-round P50
  # median (1,514 lines/day) yields 185% median utilization on 2010 Q4 training weeks
  # and saturates every schedule to 4-4-2-0-0. Sizing to the initial-training P90 daily
  # reference (2,954 lines/day) centers 2010 Q4 training utilization at 0.95 (near 1.0)
  # without touching validation or test data. All 4 training-derived regimes below are
  # evaluated side-by-side in results/uci/capacity_regimes.csv.
  primary_capacity_regime: "train_p90_quantile"
  capacity_regimes:
    - "train_p50_median"
    - "train_q4_peak_median"
    - "train_p90_quantile"
    - "train_p95_quantile"
  core_capacity_fraction: 0.70
  flex_productivity_fraction: 0.15
  initial_weekly_backlog: 0.0
  friday_penalty: 3.0
  solver_backend: "pyomo_highs"

sensitivity:
  productivity_multipliers:
    - 0.75
    - 1.00
    - 1.25
  friday_penalties:
    - 1.0
    - 3.0
    - 5.0

bootstrap:
  block_length_weeks: 3
  n_resamples: 10000
  confidence_level: 0.95
  seed: 42
