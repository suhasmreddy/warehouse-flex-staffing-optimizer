[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-flex-staffing-optimizer"
version = "1.0.0"
description = "Warehouse Flex Staffing & Demand Forecasting Optimizer (DuckDB SQL, Chronological Ridge, Pyomo + HiGHS MILP)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
